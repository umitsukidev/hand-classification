[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-channel = "2.5"
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.28.1", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.28.1", package = "gpui_platform", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
