[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-channel = "2.5"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
