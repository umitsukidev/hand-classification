[project]
name = "hand-classification-workspace"
version = "0.1.0"
description = "ディレクトリ別画像分類のモノレポワークスペース"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hand-classification"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hand-classification = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = [
    "packages/hand-classification/src",
    "packages/hand-classification/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"
