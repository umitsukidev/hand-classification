[package]
name = "hand-classification-ui"
version = "0.1.0"
edition = "2024"
description = "GPUI desktop interface for hand-classification"

[dependencies]
async-channel = "2.5"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
